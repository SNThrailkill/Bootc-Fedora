# Directories our images need under /var that the seal step removes.
#
# The seal step scrubs /var (so the sealed tree carries no /var state and the
# digest stays reproducible). That removes two kinds of directory:
#
#   1. ones our quadlets bind-mount (alloy) — systemd does not
#      create bind-mount sources, so the unit fails with `statfs
#      /var/lib/alloy: no such file or directory`;
#   2. ones an RPM created and whose service expects to find them
#      (/var/lib/iscsi, enabled by the k3s image for iSCSI CSI volumes). The
#      package's own tmpfiles entry only covers /run/lock/iscsi, so nothing
#      recreates this one.
#
# Recreate them on every boot with systemd-tmpfiles, which is what bootc's
# var-tmpfiles lint recommends for content under /var. Directory mode/owner
# mirror what the RPM installs.
d /var/lib/alloy 0755 root root -
d /var/lib/iscsi 0755 root root -
