# The k3s image ships its own bootc-fetch-only.{service,timer} (it defers
# reboots to Kured, so it uses these instead of bootc-fetch-apply-updates).
# They were written by copying the stock units and inherited the same
# ConditionPathExists=/run/ostree-booted, a marker only the ostree backend
# creates — so on a sealed (composefs) k3s node the timer never fires and the
# node silently never fetches OS updates.
#
# Clearing the condition restores the fetch/stage half of the Kured flow:
# bootc-fetch-only.sh stages the update and writes Kured's reboot sentinel;
# Kured still owns cordon/drain/reboot. On the ostree backend the marker
# exists, so this drop-in changes nothing there — and on the non-k3s sealed
# images (baseline, nginx) the unit does not exist, so it is inert.
[Unit]
ConditionPathExists=
