# The stock bootc-fetch-apply-updates.timer is conditioned on
# /run/ostree-booted, a marker only created by the ostree backend. On the
# composefs backend (sealed images) it therefore never starts, so the host
# would never auto-update. Clearing the condition restores the documented
# "fetch and apply updates" behaviour for sealed hosts.
#
# Note: updates still require working registry credentials in the image
# (/etc/ostree/auth.json, baked in from the REGISTRY_CONF CI secret) or a
# public package.
[Unit]
ConditionPathExists=
