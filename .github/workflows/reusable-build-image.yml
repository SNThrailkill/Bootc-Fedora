name: Reusable Build and Push
on:
  workflow_call:
    inputs:
      build_target:
        description: "The name of the build target in the Containerfile"
        type: string
      containerfile:
        description: "Path to Containefile used for this build"
        type: string
        default: ./Containerfile
      image_name:
        description: "Image name; defaults to build_target"
        type: string
        default: ""
      sealed:
        description: "Build and verify a sealed (UKI + composefs) variant"
        type: boolean
        default: false
      tag_override:
        description: "Publish only this tag instead of the latest/date tag set (e.g. sealed)"
        type: string
        default: ""
      build_args:
        description: "Newline-separated KEY=VALUE build args"
        type: string
        default: ""
      oci:
        description: "Use the OCI image format (required for sealed images)"
        type: boolean
        default: false


env:
  IMAGE_NAME: "${{ inputs.image_name != '' && inputs.image_name || inputs.build_target }}"
  IMAGE_DESC: "Sean's Bootc Fedora Images"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"  # do not edit

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04
    permissions:
      # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
      actions: read
      # Require writing security events to upload SARIF file to security tab
      security-events: write
      # Read commit contents
      contents: read
      # Normal build stuff
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sealed builds need room for the rootfs, the OCI archive and the
      # loopback install test on the ~14 GB hosted runner.
      - name: Maximize build space
        if: inputs.sealed && runner.environment == 'github-hosted'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      # The sealed chain signs systemd-boot and the UKI inside the build via
      # --mount=type=secret. Published images must use the repository key:
      # SECUREBOOT_DB_KEY (private) plus the committed keys/db.crt (public).
      # PR builds fall back to an ephemeral demo key because they are not
      # published; publishing with an ephemeral key requires an explicit
      # ALLOW_EPHEMERAL_SEAL_KEY repository variable.
      - name: Prepare Secure Boot key
        id: secureboot
        if: inputs.sealed
        env:
          SECUREBOOT_DB_KEY: ${{ secrets.SECUREBOOT_DB_KEY }}
          ALLOW_EPHEMERAL_SEAL_KEY: ${{ vars.ALLOW_EPHEMERAL_SEAL_KEY }}
          PUBLISHING: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/sealed-keys"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"

          if [ -n "${SECUREBOOT_DB_KEY:-}" ]; then
            printf '%s\n' "$SECUREBOOT_DB_KEY" > "$key_dir/db.key"
            chmod 600 "$key_dir/db.key"
            if [ ! -s keys/db.crt ]; then
              echo "::error::SECUREBOOT_DB_KEY is set but keys/db.crt is missing"
              exit 1
            fi
            cp keys/db.crt "$key_dir/db.crt"

            key_pub="$(openssl pkey -in "$key_dir/db.key" -pubout -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
            cert_pub="$(openssl x509 -in "$key_dir/db.crt" -pubkey -noout 2>/dev/null | openssl pkey -pubin -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
            if [ -z "$key_pub" ] || [ "$key_pub" != "$cert_pub" ]; then
              echo "::error::SECUREBOOT_DB_KEY does not match keys/db.crt"
              exit 1
            fi
            echo "source=secret" >> "$GITHUB_OUTPUT"
            echo "::notice::Using the repository Secure Boot db key from SECUREBOOT_DB_KEY"
          elif [ "$PUBLISHING" = "true" ] && [ "${ALLOW_EPHEMERAL_SEAL_KEY:-}" != "true" ]; then
            echo "::error::Refusing to publish a sealed image signed by a throwaway key. Set SECUREBOOT_DB_KEY and commit keys/db.crt, or set the ALLOW_EPHEMERAL_SEAL_KEY repository variable for demo-only images."
            exit 1
          else
            ./build.py keygen --demo --key-dir "$key_dir"
            echo "source=ephemeral" >> "$GITHUB_OUTPUT"
            if [ "$PUBLISHING" = "true" ]; then
              echo "::warning::Publishing a sealed image with an ephemeral key because ALLOW_EPHEMERAL_SEAL_KEY=true; it cannot be verified or booted without this run's key."
            else
              echo "::notice::Using an ephemeral demo Secure Boot key; PR builds are not published."
            fi
          fi

          test -s "$key_dir/db.key"
          test -s "$key_dir/db.crt"
          for f in PK KEK db; do
            test -s "keys/auth/auto/${f}.auth" || {
              echo "::error::missing public enrollment blob keys/auth/auto/${f}.auth"
              exit 1
            }
          done

      - name: Compute image tags
        id: imagetags
        run: |
          DATE_SHORT="$(date -u +%Y%m%d)"
          if [ -n "${{ inputs.tag_override }}" ]; then
            TAGS="type=raw,value=${{ inputs.tag_override }}"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              TAGS="$TAGS"$'\n'"type=sha"$'\n'"type=ref,event=pr"
            fi
          else
            TAGS="type=raw,value=latest"$'\n'"type=raw,value=latest.${DATE_SHORT}"$'\n'"type=raw,value=${DATE_SHORT}"$'\n'"type=sha,enable=${{ github.event_name == 'pull_request' }}"$'\n'"type=ref,event=pr"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "primary=${{ inputs.tag_override != '' && inputs.tag_override || 'latest' }}" >> "$GITHUB_OUTPUT"

      # Workaround bug where capital letters in your GitHub username make it impossible to push to GHCR.
      # https://github.com/macbre/push-to-ghcr/issues/12
      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      - name: Lowercase Image
        id: image_case
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ env.IMAGE_NAME }}

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # Tag set computed above: either the sealed override tag or the
          # default latest/date/pr tags.
          tags: ${{ steps.imagetags.outputs.tags }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/refs/heads/main/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/refs/heads/main/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/main/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=latest
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=bootc,ublue,universal-blue
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.ARTIFACTHUB_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      # If you are going to do a private registry for your images, you'll need to provide an auth.json
      # to /etc/ostree/auth.json. If you will need to auth into private registries for containers that
      # will run on your bootc image then youll need another separate auth.json to /etc/containers/auth.json
      # See https://docs.fedoraproject.org/en-US/bootc/container-pull-secrets/
      # - name: Add Private Registry Auth File
      #   env:
      #     REGISTRY_CONF: ${{ secrets.REGISTRY_CONF }}
      #   run: echo $REGISTRY_CONF >> ./auth.json

      - name: Compute build args
        id: buildargs
        run: |
          ARGS="--target=${{ inputs.build_target }}"
          if [ "${{ inputs.sealed }}" = "true" ]; then
            ARGS="$ARGS --secret id=secureboot_key,src=$RUNNER_TEMP/sealed-keys/db.key --secret id=secureboot_cert,src=$RUNNER_TEMP/sealed-keys/db.crt --device /dev/fuse --cap-add=all"
          fi
          while IFS= read -r line; do
            [ -n "$line" ] && ARGS="$ARGS --build-arg $line"
          done <<< "${{ inputs.build_args }}"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          containerfiles: |
            ${{ inputs.containerfile }}
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          extra-args: ${{ steps.buildargs.outputs.args }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: ${{ inputs.oci }}
          # buildah-build v3 squashes by default; keep v2's layered output.
          squash: false

      # Split the Dockerfile layers into content-based layers so bootc hosts
      # only pull the layers that changed. Sealed images must stay flat:
      # chunkah's re-layering does not preserve the xattrs/EROFS metadata that
      # the composefs digest covers, and the loopback install smoke test below
      # fails with a digest mismatch if a sealed image is chunked.
      - name: Rechunk image with chunkah
        id: chunkah
        if: ${{ !inputs.sealed }}
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          read -r -a tags <<< "${TAGS}"
          src="${IMAGE_NAME}:${tags[0]}"
          tmp="${IMAGE_NAME}:chunkah-tmp"
          config="$(python3 .github/chunkah/config-from-buildah.py "${src}")"

          echo "Rechunking ${src} with chunkah"
          buildah build \
            --skip-unused-stages=false \
            --from "${src}" \
            --build-arg CHUNKAH=quay.io/coreos/chunkah:v0.7.1 \
            --build-arg CHUNKAH_CONFIG_STR="${config}" \
            --build-arg CHUNKAH_ARGS="--prune /sysroot/ --max-layers 128 --label ostree.commit- --label ostree.final-diffid-" \
            -t "${tmp}" \
            -v "${PWD}:/run/src" \
            --security-opt=label=disable \
            -f .github/chunkah/Containerfile.splitter .

          for tag in "${tags[@]}"; do
            buildah tag "${tmp}" "${IMAGE_NAME}:${tag}"
          done
          echo "Chunked image ready"

      - name: Export sealed image to OCI archive
        if: inputs.sealed
        run: |
          set -euo pipefail
          buildah push "${IMAGE_NAME}:${{ steps.imagetags.outputs.primary }}" \
            "oci-archive:${RUNNER_TEMP}/image.tar"

      - name: Setup Syft
        id: setup-syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.56.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request' || inputs.sealed
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull previous sealed image
        id: previous
        if: inputs.sealed
        env:
          IMAGE: ${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}
          TAG: ${{ steps.imagetags.outputs.primary }}
        run: |
          set -euo pipefail
          # The tag still points at the previously published image here; the
          # new build is only pushed to the staging tag below. Capture the
          # image ID now so the upgrade test starts from the old deployment.
          if sudo podman pull --authfile "$HOME/.docker/config.json" "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            image_id="$(sudo podman image inspect --format '{{.Id}}' "${IMAGE}:${TAG}")"
            prev_ref="localhost/sealed-previous:${image_id#sha256:}"
            sudo podman tag "${IMAGE}:${TAG}" "$prev_ref"
            echo "ref=$prev_ref" >> "$GITHUB_OUTPUT"
            echo "::notice::Upgrade smoke test will start from ${IMAGE}:${TAG} (${image_id})"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "::notice::No previous ${IMAGE}:${TAG}; running install-only smoke test"
          fi

      - name: Generate SBOM
        id: generate-sbom
        run: |
          set -euo pipefail
          if [ "${{ inputs.sealed }}" = "true" ]; then
            # Scan the exact sealed OCI archive that the smoke test loads.
            syft scan "oci-archive:${RUNNER_TEMP}/image.tar" -o "spdx-json=sbom.json"
          else
            # Scan the chunkah OCI layout, not the registry's previous image.
            # The pushed image is imported from this layout.
            syft scan "oci-dir:out" -o "spdx-json=sbom.json"
            rm -rf out
          fi

      - name: Scan SBOM for vulnerabilities
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: "sbom.json"
          output-file: "sarif.json"
          fail-build: false
          severity-cutoff: critical

      # GitHub Code Scanning rejects a SARIF run with more than 25,000
      # results. Grype emits every severity, and the CentOS Stream NAS SBOM
      # produces ~41k; keep only error-level (high/critical) findings so the
      # upload stays valid. The full report is still in the scan step log.
      - name: Trim SARIF to high/critical findings
        id: trim-sarif
        env:
          SARIF_IN: ${{ steps.scan.outputs.sarif }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          src = Path(os.environ.get("SARIF_IN") or "sarif.json")
          dst = Path("sarif-filtered.json")
          data = json.loads(src.read_text())

          before = 0
          kept = 0
          rules_before = 0
          rules_after = 0
          for run in data.get("runs", []):
              results = run.get("results", [])
              before += len(results)
              filtered = [r for r in results if r.get("level") == "error"]
              run["results"] = filtered
              kept += len(filtered)

              driver = run.get("tool", {}).get("driver", {})
              rules = driver.get("rules", [])
              rules_before += len(rules)
              if rules:
                  kept_ids = {r.get("ruleId") for r in filtered if r.get("ruleId")}
                  kept_rules = [rule for rule in rules if rule.get("id") in kept_ids]
                  new_index = {rule.get("id"): i for i, rule in enumerate(kept_rules)}
                  for result in filtered:
                      index = new_index.get(result.get("ruleId"))
                      if "ruleIndex" in result:
                          if index is None:
                              result.pop("ruleIndex", None)
                          else:
                              result["ruleIndex"] = index
                  driver["rules"] = kept_rules
                  rules_after += len(kept_rules)

          dst.write_text(json.dumps(data))
          print(
              f"SARIF results: {before} -> {kept}; "
              f"rules: {rules_before} -> {rules_after}"
          )
          if kept > 25000 or rules_after > 25000:
              raise SystemExit("still over GitHub's 25000-result/rule limit")
          PY

      - name: Upload SARIF report
        id: upload
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: sarif-filtered.json

      # Stage the sealed image under a non-public tag, then test that exact
      # registry digest. The :sealed tag is only updated after the smoke test
      # passes, so a broken seal cannot replace the last good published image.
      - name: Tag sealed candidate
        if: inputs.sealed && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          buildah tag "${IMAGE_NAME}:${{ steps.imagetags.outputs.primary }}" "${IMAGE_NAME}:sealed-candidate"

      - name: Push sealed candidate
        id: push-candidate
        if: inputs.sealed && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          registry: ${{ steps.registry_case.outputs.lowercase }}
          image: ${{ steps.image_case.outputs.lowercase }}
          tags: sealed-candidate
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare sealed smoke-test image
        id: smoke-image
        if: inputs.sealed
        env:
          IMAGE: ${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}
          TAG: ${{ steps.imagetags.outputs.primary }}
          CANDIDATE_DIGEST: ${{ steps.push-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -n "${CANDIDATE_DIGEST:-}" ]; then
            # Main: pull the staged registry digest, not the local build.
            sudo podman pull --authfile "$HOME/.docker/config.json" \
              "${IMAGE}@${CANDIDATE_DIGEST}"
            image_id="$(sudo podman image inspect --format '{{.Id}}' "${IMAGE}@${CANDIDATE_DIGEST}")"
            current_ref="localhost/sealed-current:${image_id#sha256:}"
            sudo podman tag "$image_id" "$current_ref"
          else
            # PR: nothing is published, so test the archive this job built.
            loaded="$(sudo podman load -i "$RUNNER_TEMP/image.tar")"
            echo "$loaded"
            loaded_ref="$(echo "$loaded" | sed -n 's/^Loaded image: //p' | head -1 | awk '{print $1}')"
            [ -n "$loaded_ref" ] || loaded_ref="$(sudo podman images -q --no-trunc | head -1)"
            image_id="$(sudo podman image inspect --format '{{.Id}}' "$loaded_ref")"
            current_ref="localhost/sealed-current:${image_id#sha256:}"
            sudo podman tag "$loaded_ref" "$current_ref"
          fi
          sudo podman image inspect "$current_ref" >/dev/null
          echo "ref=$current_ref" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/image.tar"

      - name: Verify sealed UKI signatures
        if: inputs.sealed
        env:
          RUN_REF: ${{ steps.smoke-image.outputs.ref }}
          KEY_DIR: ${{ runner.temp }}/sealed-keys
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint /bin/bash \
            -v "$KEY_DIR:/keys:ro" \
            "$RUN_REF" -c '
            set -eux
            kver=$(ls /usr/lib/modules)
            # --list is diagnostic; --cert is the enforced expected-key check.
            sbverify --list "/boot/EFI/Linux/${kver}.efi"
            sbverify --cert /keys/db.crt "/boot/EFI/Linux/${kver}.efi"
            sbverify --list /usr/lib/systemd/boot/efi/systemd-bootx64.efi
            sbverify --cert /keys/db.crt /usr/lib/systemd/boot/efi/systemd-bootx64.efi
            objdump -s -j .cmdline "/boot/EFI/Linux/${kver}.efi"
            strings -a "/boot/EFI/Linux/${kver}.efi" | grep -q "composefs.digest"
            for f in PK KEK db; do
              test -s "/usr/lib/bootc/install/secureboot-keys/auto/${f}.auth"
            done
          '
          echo "::notice::Sealed UKI and systemd-boot signatures verified against the expected db certificate"

      # On main, install and upgrade the exact registry digest staged above;
      # on PRs, use the local OCI archive because nothing is published. The
      # install fails unless every digest baked into the signed UKI matches
      # the EROFS image bootc generates from the pulled layers. The script
      # also starts from the previous :sealed image when it exists, so the
      # second phase exercises the in-place upgrade path.
      - name: Sealed install and upgrade smoke test
        if: inputs.sealed
        env:
          CURRENT_REF: ${{ steps.smoke-image.outputs.ref }}
          PREVIOUS_REF: ${{ steps.previous.outputs.ref }}
          IMAGE: ${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}
          TAG: ${{ steps.imagetags.outputs.primary }}
          KEY_DIR: ${{ runner.temp }}/sealed-keys
          WORK_DIR: ${{ runner.temp }}/sealed-test
        run: ./.github/scripts/sealed-smoke-test.sh

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        with:
          registry: ${{ steps.registry_case.outputs.lowercase }}
          image: ${{ steps.image_case.outputs.lowercase }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the tested digest was published
        if: inputs.sealed && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TESTED: ${{ steps.push-candidate.outputs.digest }}
          PUBLISHED: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$TESTED"
          test "$TESTED" = "$PUBLISHED"
          echo "::notice::Tested and published digest: $PUBLISHED"

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      # Primary path: log signatures and attestations in the public Rekor
      # transparency log so anyone can verify them. If Rekor is unavailable,
      # the fallback steps sign without a tlog entry so a Rekor outage cannot
      # block CD.
      - name: Sign container image (Rekor)
        id: sign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        env:
          IMAGE: ${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          # Sign the pushed digest, not the mutable tag, so the signature is
          # attached to exactly the chunked image this run produced.
          cosign sign -y \
            --signing-config .github/cosign/signing-config-rekor.json \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE}@${DIGEST}"

      - name: Sign container image (no Rekor fallback)
        id: sign-fallback
        if: steps.sign.outcome == 'failure'
        env:
          IMAGE: ${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          echo "::warning::Rekor signing failed; signing without a transparency-log entry"
          cosign sign -y \
            --signing-config .github/cosign/signing-config-no-rekor.json \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE}@${DIGEST}"

      - name: Attest SBOM (Rekor)
        id: attest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        env:
          IMAGE: ${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_TIMEOUT: 5m0s
        run: |
          cosign attest -y \
            --signing-config .github/cosign/signing-config-rekor.json \
            --predicate ./sbom.json \
            --type spdxjson \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE}@${DIGEST}"

      - name: Attest SBOM (no Rekor fallback)
        id: attest-fallback
        if: steps.attest.outcome == 'failure'
        env:
          IMAGE: ${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_TIMEOUT: 5m0s
        run: |
          echo "::warning::Rekor attestation failed; attesting without a transparency-log entry"
          cosign attest -y \
            --signing-config .github/cosign/signing-config-no-rekor.json \
            --predicate ./sbom.json \
            --type spdxjson \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE}@${DIGEST}"

      - name: Verify image signature
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (steps.sign.outcome == 'success' || steps.sign-fallback.outcome == 'success')
        env:
          IMAGE: ${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Enforced: the signature must verify against the committed public key.
          cosign verify \
            --key cosign.pub \
            --insecure-ignore-tlog=true \
            "${IMAGE}@${DIGEST}"

      - name: Verify SBOM attestation
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (steps.attest.outcome == 'success' || steps.attest-fallback.outcome == 'success')
        env:
          IMAGE: ${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Enforced: the SBOM attestation must verify against cosign.pub.
          cosign verify-attestation \
            --key cosign.pub \
            --insecure-ignore-tlog=true \
            --type spdxjson \
            "${IMAGE}@${DIGEST}"

      - name: Verify Rekor entries
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.sign.outcome == 'success' && steps.attest.outcome == 'success'
        continue-on-error: true
        env:
          IMAGE: ${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Optional when Rekor is reachable; the offline verification above
          # is the blocking check. A Rekor outage must not fail CI.
          cosign verify --key cosign.pub "${IMAGE}@${DIGEST}"
          cosign verify-attestation --key cosign.pub --type spdxjson "${IMAGE}@${DIGEST}"
