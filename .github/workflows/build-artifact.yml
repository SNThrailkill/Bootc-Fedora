name: Build Bootc Artifact
on:
  # Requires build_type/flavor inputs provided by workflow_dispatch; these do
  # not exist for pull_request events, so only enable manual dispatch.
  workflow_dispatch:
    inputs:
      build_type:
        description: 'The type of artifact to create from your bootc image'
        type: choice
        required: true
        options:
          - "ami"
          - "qcow2"
          - "vmdk"
          - "anaconda-iso"
          - "raw"
          - "vhd"
          - "gce"
      flavor:
        description: 'The image to create the artifact for'
        type: choice
        required: true
        options:
          - "base"
          - "nginx"
          - "k3s"
          - "prometheus"
          #- "nas"

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository }}/${{ github.event.inputs.flavor }}"
  DEFAULT_TAG: "latest"

jobs:
  build:
    name: Build Artifact
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Workaround bug where capital letters in your GitHub username make it impossible to push to GHCR.
      # https://github.com/macbre/push-to-ghcr/issues/12
      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      # - name: Maximize build space
      #   if: inputs.platform != 'arm64'
      #   uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
      #   with:
      #     remove-codeql: true

      - name: Login to GitHub Container Registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This action is archived upstream and has no release with the Node 24
      # runtime; pin its final main commit, which only adds the deprecation
      # notice and switches runs.using from node20 to node24. The maintained
      # replacement (osbuild/image-builder-action) has a different input model
      # and needs a separate migration.
      - name: Build bootable image using bootc-image-builder
        id: build
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347 # main (node24; archived)
        with:
          image: ${{ steps.registry_case.outputs.lowercase }}:${{ env.DEFAULT_TAG }}
          types: ${{ github.event.inputs.build_type }}
          config-file: ./config.toml
          rootfs: btrfs
          additional-args: --use-librepo=True

      - name: Upload Bootable Image Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootc-image-${{ github.event.inputs.build_type }}
          path: ${{ github.workspace }}/output/*
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true         