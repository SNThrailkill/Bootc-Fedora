name: Build Bootc Artifact
on:
  # Requires build_type/flavor inputs provided by workflow_dispatch; these do
  # not exist for pull_request events, so only enable manual dispatch.
  workflow_dispatch:
    inputs:
      build_type:
        description: 'The type of artifact to create from your bootc image'
        type: choice
        required: true
        options:
          - "ami"
          - "qcow2"
          - "vmdk"
          - "raw"
          - "vhd"
          - "gce"
          - "bootc-generic-iso"
      installer_ref:
        description: 'Installer container for bootc-generic-iso (required for that type)'
        type: string
        required: false
        default: ''
      flavor:
        description: 'The image to create the artifact for'
        type: choice
        required: true
        options:
          - "base"
          - "nginx"
          - "k3s"
          - "prometheus"
          #- "nas"

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository }}/${{ github.event.inputs.flavor }}"
  DEFAULT_TAG: "latest"

jobs:
  build:
    name: Build Artifact
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Workaround bug where capital letters in your GitHub username make it impossible to push to GHCR.
      # https://github.com/macbre/push-to-ghcr/issues/12
      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      # - name: Maximize build space
      #   if: inputs.platform != 'arm64'
      #   uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
      #   with:
      #     remove-codeql: true

      - name: Login to GitHub Container Registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate installer reference
        if: inputs.build_type == 'bootc-generic-iso' && inputs.installer_ref == ''
        run: |
          echo "::error::bootc-generic-iso requires installer_ref"
          exit 1

      # The archive is generated with the maintained image-builder action.
      # There are no tagged releases yet, so pin the current main commit.
      # image-builder has no config-file/additional-args inputs, so the old
      # config.toml root-size customization and --use-librepo are not carried
      # over; bootc_default_fs=btrfs matches the previous rootfs setting.
      - name: Build bootable image using image-builder
        id: build
        uses: osbuild/image-builder-action@a56f95dd77327e604a4f4d9fc06a9641313fda36 # main (no tagged releases yet)
        with:
          # Disk images install this bootc image. The ISO type uses
          # installer_ref as the Anaconda environment and the bootc image as
          # the payload.
          bootc_ref: ${{ inputs.build_type == 'bootc-generic-iso' && inputs.installer_ref || format('{0}:{1}', steps.registry_case.outputs.lowercase, env.DEFAULT_TAG) }}
          bootc_installer_payload_ref: ${{ inputs.build_type == 'bootc-generic-iso' && format('{0}:{1}', steps.registry_case.outputs.lowercase, env.DEFAULT_TAG) || '' }}
          bootc_default_fs: btrfs
          image_type: ${{ inputs.build_type }}

      - name: Upload Bootable Image Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootc-image-${{ inputs.build_type }}
          path: ${{ github.workspace }}/output/**
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
