name: Build Bootc Images
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * 0'  # 10:05am UTC every Sunday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The image table in build.py is the source of truth. This job turns it into
  # the reusable-workflow matrix so adding an image does not require editing
  # the workflow.
  matrix:
    name: Compute image matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build matrix from build.py
        id: matrix
        run: echo "matrix=$(./build.py matrix --compact)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: matrix
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    with:
      build_target: ${{ matrix.build_target }}
      containerfile: ${{ matrix.containerfile }}
      image_name: ${{ matrix.image_name }}
      tag_override: ${{ matrix.tag_override }}
      build_args: ${{ matrix.build_args }}
      sealed: ${{ matrix.sealed }}
      oci: ${{ matrix.oci }}
