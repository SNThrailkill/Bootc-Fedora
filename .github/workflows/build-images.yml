name: Build Bootc Images
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * 0'  # 10:05am UTC every Sunday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-base:
    name: Build Base Image
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    strategy:
      fail-fast: false
    with:
      build_target: base

  build-nginx:
    name: Build Nginx Image
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    strategy:
      fail-fast: false
    with:
      build_target: nginx

  # Seal the nginx content stage in one build from the beginning. This does
  # not depend on build-nginx or a published base image: SEALED_FROM=nginx
  # makes the `sealed` target build the content stage and the seal chain in
  # the same Containerfile invocation. The loopback install smoke test in the
  # reusable workflow fails the job if the seal does not verify.
  build-nginx-sealed:
    name: Build Nginx Sealed Image
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    strategy:
      fail-fast: false
    with:
      build_target: sealed
      build_args: SEALED_FROM=nginx
      image_name: nginx
      tag_override: sealed
      sealed: true
      oci: true

  build-k3s:
    name: Build K3s Image
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    strategy:
      fail-fast: false
    with:
      build_target: k3s
      containerfile: ./k3s/Containerfile

  build-prometheus:
    name: Build Prometheus Image
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    strategy:
      fail-fast: false
    with:
      build_target: prometheus

  build-nas:
    name: Build NAS Image
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    strategy:
      fail-fast: false
    with:
      build_target: nas
      containerfile: ./nas/Containerfile
